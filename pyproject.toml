[project]
name = "openai-ads-mcp"
version = "0.1.0"
description = "Unofficial MCP server for the OpenAI Ads Advertiser API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "openai-ads-mcp contributors" }]
keywords = ["mcp", "openai", "ads", "chatgpt"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx==0.28.1",
    "mcp==1.30.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
openai-ads-mcp = "openai_ads_mcp.server:main"

[project.urls]
Documentation = "https://developers.openai.com/ads"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openai_ads_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
