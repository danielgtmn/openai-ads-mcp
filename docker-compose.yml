# Coolify can build this Compose file. Do not publish a host port; the proxy
# reaches the container on port 8000. Set the variables in Coolify and mark
# OPENAI_ADS_API_KEY and MCP_AUTH_TOKEN as secrets.

services:
  openai-ads-mcp:
    build:
      context: .
    image: openai-ads-mcp:local
    environment:
      OPENAI_ADS_API_KEY: ${OPENAI_ADS_API_KEY}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      MCP_READ_ONLY: ${MCP_READ_ONLY:-true}
      HOST: 0.0.0.0
      PORT: ${PORT:-8000}
      OPENAI_ADS_BASE_URL: ${OPENAI_ADS_BASE_URL:-https://api.ads.openai.com/v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
